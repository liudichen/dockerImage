name: Sync Magpie Image from GHCR to Docker Hub

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-ghcr-to-dockerhub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dockerHub
    permissions:
      contents: read
      packages: read

    env:
      SOURCE_IMAGE: ghcr.io/yetone/magpie:latest
      TARGET_IMAGE: liudichen/magpie:latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Check if source image updated
        id: check
        uses: lucacome/docker-image-update-checker@v3
        with:
          base-image: ${{ env.SOURCE_IMAGE }}
          image: ${{ env.TARGET_IMAGE }}

      - name: Copy image to Docker Hub
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outputs.needs-building == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ env.TARGET_IMAGE }}" \
            "${{ env.SOURCE_IMAGE }}"
