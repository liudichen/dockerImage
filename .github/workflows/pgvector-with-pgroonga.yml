name: Auto-rebuild dockerImage liudichen/pgvector-with-pgroonga

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  check-and-rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.dockerHub.DOCKERHUB_USERNAME }}
          password: ${{ secrets.dockerHub.DOCKERHUB_TOKEN }}

      - name: Check if base image updated
        id: check
        uses: lucacome/docker-image-update-checker@v3.1.2
        with:
          base-image: 'pgvector/pgvector:pg18' 
          image: 'liudichen/pgvector-with-pgroonga:pg18'

      - name: Build and push if needed
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outputs.needs-building == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./pgvector-with-pgroonga
          push: true
          tags: liudichen/pgvector-with-pgroonga:pg18
          pull: true
          platforms: linux/amd64
